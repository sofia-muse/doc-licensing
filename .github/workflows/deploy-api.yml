name: Deploy API to Azure App Service

on:
  push:
    branches: [ main ]
    paths:
      - 'src/DocLicensing.Api/**'
      - 'src/DocLicensing.Core/**'
      - 'src/DocLicensing.Infrastructure/**'
      - 'DocLicensing.sln'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: doc-licensing-sofiamuse
  DOTNET_VERSION: '8.0.x'
  PUBLISH_DIR: ./publish

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore

      - run: dotnet publish src/DocLicensing.Api/DocLicensing.Api.csproj -c Release -o ${{ env.PUBLISH_DIR }} --no-restore

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}
